<g id="fv-lista"><text x="720" y="685.5" font-size="16" font-weight="600" fill="#7b8794">Restauración (1930–1943)</text>
<text x="720" y="705.5" font-size="14" fill="#7b8794">El golpe del 6-sep-1930 depone a Yrigoyen; desde 1932,</text>
<text x="720" y="723.5" font-size="14" fill="#7b8794">presidentes elegidos con fraude: la «restauración conservadora»</text>
<text x="720" y="576.5" font-size="16" font-weight="600" fill="#7b8794">Gobierno de Perón (1943–1955)</text>
<text x="720" y="596.5" font-size="14" fill="#7b8794">El golpe del 4-jun-1943 abre un gobierno militar donde asciende</text>
<text x="720" y="614.5" font-size="14" fill="#7b8794">Perón; elegido en 1946 y 1951, cae con el golpe de 1955</text>
<text x="720" y="467.5" font-size="16" font-weight="600" fill="#1f2933">Proscripción (1955–1966)<tspan font-weight="400" fill="#7b8794" font-size="13"> · contiene 5 piezas → figura aparte</tspan></text>
<text x="720" y="487.5" font-size="14" fill="#7b8794">Con el peronismo prohibido, Frondizi e Illia, elegidos sin él,</text>
<text x="720" y="505.5" font-size="14" fill="#7b8794">caen por golpes; Romero titula el tramo «El empate»</text>
<text x="720" y="358.5" font-size="16" font-weight="600" fill="#7b8794">Golpe del 66 y retorno (1966–1976)</text>
<text x="720" y="378.5" font-size="14" fill="#7b8794">El golpe del 28-jun-1966 inicia la «Revolución Argentina»; en</text>
<text x="720" y="396.5" font-size="14" fill="#7b8794">1973 vuelven las elecciones y Perón, que muere en 1974</text>
<text x="720" y="249.5" font-size="16" font-weight="600" fill="#7b8794">El Proceso (1976–1983)</text>
<text x="720" y="269.5" font-size="14" fill="#7b8794">La Junta depone a Isabel Perón (1976) y aplica una represión</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">ilegal, juzgada en 1985; tras Malvinas llama a elecciones</text></g>
</svg>