<g id="fv-lista"><text x="720" y="596.0" font-size="16" font-weight="600" fill="#7b8794">Corpúsculo de Pacini</text>
<text x="720" y="616.0" font-size="14" fill="#7b8794">Su cápsula en capas filtra la presión sostenida y solo deja</text>
<text x="720" y="634.0" font-size="14" fill="#7b8794">pasar los cambios rápidos, como la vibración</text>
<text x="720" y="431.5" font-size="16" font-weight="600" fill="#7b8794">Terminación de Ruffini</text>
<text x="720" y="451.5" font-size="14" fill="#7b8794">Mide el estiramiento de la piel desde la dermis; su campo grande</text>
<text x="720" y="469.5" font-size="14" fill="#7b8794">no sirve para separar dos puntos cercanos</text>
<text x="720" y="317.5" font-size="16" font-weight="600" fill="#7b8794">Corpúsculo de Meissner</text>
<text x="720" y="337.5" font-size="14" fill="#7b8794">Avisa del movimiento sobre la piel y se calla si el contacto</text>
<text x="720" y="355.5" font-size="14" fill="#7b8794">sigue; campo pequeño, cerca de la superficie</text>
<text x="720" y="203.5" font-size="16" font-weight="600" fill="#1f2933">Disco de Merkel</text>
<text x="720" y="223.5" font-size="14" fill="#7b8794">Señala bordes y puntos mientras dura la presión, con un campo</text>
<text x="720" y="241.5" font-size="14" fill="#7b8794">pequeño; en la yema se apiña, y con él la agudeza</text></g>
</svg>