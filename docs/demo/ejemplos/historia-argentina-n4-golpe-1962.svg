<g id="fv-lista"><text x="720" y="675.5" font-size="16" font-weight="600" fill="#7b8794">Arturo Frondizi (UCRI)</text>
<text x="720" y="695.5" font-size="14" fill="#7b8794">Presidente desde 1958: admite listas peronistas en 1962,</text>
<text x="720" y="713.5" font-size="14" fill="#7b8794">interviene provincias tras su triunfo y acaba preso en Martín G…</text>
<text x="720" y="561.5" font-size="16" font-weight="600" fill="#7b8794">Peronismo proscripto</text>
<text x="720" y="581.5" font-size="14" fill="#7b8794">Con otros sellos, como Unión Popular, gana el 18-mar-1962 en</text>
<text x="720" y="599.5" font-size="14" fill="#7b8794">nueve provincias, entre ellas Buenos Aires, con Andrés Framini</text>
<text x="720" y="425.0" font-size="16" font-weight="600" fill="#1f2933">Fuerzas Armadas</text>
<text x="720" y="445.0" font-size="14" fill="#7b8794">Rechazan el resultado, deponen a Frondizi el 29 de marzo y</text>
<text x="720" y="463.0" font-size="14" fill="#7b8794">condicionan al gobierno siguiente a anular las elecciones</text>
<text x="720" y="267.5" font-size="16" font-weight="600" fill="#7b8794">José María Guido</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">Presidente provisional del Senado: jura ante la Corte Suprema</text>
<text x="720" y="305.5" font-size="14" fill="#7b8794">por la ley de acefalía y anula los comicios en abril de 1962</text></g>
</svg>