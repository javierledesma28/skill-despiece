<g id="fv-lista"><text x="720" y="431.5" font-size="16" font-weight="600" fill="#1f2933">Annie (1841–1851)</text>
<text x="720" y="451.5" font-size="14" fill="#7b8794">Nace el 2-mar-1841 y muere en Malvern el 23-abr-1851, a los 10</text>
<text x="720" y="469.5" font-size="14" fill="#7b8794">años; una semana después Darwin escribe un recuerdo de ella</text>
<text x="720" y="317.5" font-size="16" font-weight="600" fill="#7b8794">Mary Eleanor (1842)</text>
<text x="720" y="337.5" font-size="14" fill="#7b8794">La tercera hija: vive 23 días y muere en 1842, de causa</text>
<text x="720" y="355.5" font-size="14" fill="#7b8794">desconocida</text>
<text x="720" y="203.5" font-size="16" font-weight="600" fill="#7b8794">Charles Waring (1856–1858)</text>
<text x="720" y="223.5" font-size="14" fill="#7b8794">El último hijo: muere en 1858, a los 18 meses, de escarlatina</text></g>
