<g id="fv-lista"><text x="720" y="718.5" font-size="16" font-weight="600" fill="#7b8794">Requisitos del SGSI (4–10)</text>
<text x="720" y="738.5" font-size="14" fill="#7b8794">Sostiene al resto: del análisis de riesgos sale la Declaración</text>
<text x="720" y="756.5" font-size="14" fill="#7b8794">de Aplicabilidad, que dice qué controles se auditan</text>
<text x="720" y="576.5" font-size="16" font-weight="600" fill="#7b8794">Organizacionales (37)</text>
<text x="720" y="596.5" font-size="14" fill="#7b8794">Agrupa 37 controles de gobierno: políticas, roles, proveedores,</text>
<text x="720" y="614.5" font-size="14" fill="#7b8794">incidentes y continuidad</text>
<text x="720" y="467.5" font-size="16" font-weight="600" fill="#7b8794">Personas (8)</text>
<text x="720" y="487.5" font-size="14" fill="#7b8794">Agrupa 8 controles sobre quien trabaja: selección,</text>
<text x="720" y="505.5" font-size="14" fill="#7b8794">concienciación, régimen disciplinario y teletrabajo</text>
<text x="720" y="358.5" font-size="16" font-weight="600" fill="#7b8794">Físicos (14)</text>
<text x="720" y="378.5" font-size="14" fill="#7b8794">Agrupa 14 controles sobre lugares y equipos: perímetros,</text>
<text x="720" y="396.5" font-size="14" fill="#7b8794">accesos, puesto despejado y suministros</text>
<text x="720" y="249.5" font-size="16" font-weight="600" fill="#1f2933">Tecnológicos (34)<tspan font-weight="400" fill="#7b8794" font-size="13"> · contiene 4 piezas → figura aparte</tspan></text>
<text x="720" y="269.5" font-size="14" fill="#7b8794">Agrupa 34 controles técnicos: accesos, cifrado, copias,</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">registros, vulnerabilidades y desarrollo</text></g>
</svg>