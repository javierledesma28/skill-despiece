<g id="fv-lista"><text x="720" y="720.0" font-size="16" font-weight="600" fill="#7b8794">Dos enlaces, uno por red</text>
<text x="720" y="740.0" font-size="14" fill="#7b8794">Cada red crea su mitad; «Connected» solo dice que existen las</text>
<text x="720" y="758.0" font-size="14" fill="#7b8794">dos, no qué comparten</text>
<text x="720" y="571.0" font-size="16" font-weight="600" fill="#7b8794">Permitir tránsito (central)</text>
<text x="720" y="591.0" font-size="14" fill="#7b8794">En el enlace de la central: deja que su VPN Gateway reenvíe</text>
<text x="720" y="609.0" font-size="14" fill="#7b8794">tráfico a la radial; exige que la central tenga gateway</text>
<text x="720" y="413.5" font-size="16" font-weight="600" fill="#1f2933">Usar gateway remoto (radial)</text>
<text x="720" y="433.5" font-size="14" fill="#7b8794">En el enlace radial: adopta el gateway central; exige que la</text>
<text x="720" y="451.5" font-size="14" fill="#7b8794">central permita el tránsito y que la radial no tenga gateway</text>
<text x="720" y="249.5" font-size="16" font-weight="600" fill="#7b8794">Rutas aprendidas (radial)</text>
<text x="720" y="269.5" font-size="14" fill="#7b8794">Con los dos ajustes, los rangos de la oficina llegan a las</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">subredes radiales con salto «Virtual network gateway»</text></g>
</svg>