<g id="fv-lista"><text x="720" y="820.0" font-size="16" font-weight="600" fill="#7b8794">Hielo casi puro</text>
<text x="720" y="840.0" font-size="14" fill="#7b8794">Forma mantos de más de 100 m en latitudes medias, desde 1–2 m de</text>
<text x="720" y="858.0" font-size="14" fill="#7b8794">hondura; probablemente nieve de épocas de eje más inclinado</text>
<text x="720" y="696.0" font-size="16" font-weight="600" fill="#7b8794">Hielo de poros</text>
<text x="720" y="716.0" font-size="14" fill="#7b8794">Cementa el suelo con vapor helado entre los granos: fue cerca</text>
<text x="720" y="734.0" font-size="14" fill="#7b8794">del 90 % del hielo que se destapó en Phoenix</text>
<text x="720" y="604.0" font-size="16" font-weight="600" fill="#7b8794">Tabla de hielo</text>
<text x="720" y="624.0" font-size="14" fill="#7b8794">Marca dónde empieza el suelo helado: en Phoenix, a 4,6 cm de</text>
<text x="720" y="642.0" font-size="14" fill="#7b8794">media bajo el suelo seco</text>
<text x="720" y="436.0" font-size="16" font-weight="600" fill="#7b8794">Sublimación</text>
<text x="720" y="456.0" font-size="14" fill="#7b8794">Devuelve al aire el hielo que queda expuesto: el que destaparon</text>
<text x="720" y="474.0" font-size="14" fill="#7b8794">cráteres nuevos en latitudes medias se fue apagando en meses</text>
<text x="720" y="287.0" font-size="16" font-weight="600" fill="#1f2933">Equilibrio con el aire</text>
<text x="720" y="307.0" font-size="14" fill="#7b8794">Fija a qué hondura dura el hielo: la capa seca de encima</text>
<text x="720" y="325.0" font-size="14" fill="#7b8794">adelgaza del 42° S al 77° S, como predicen los modelos</text></g>
</svg>