<g id="fv-lista"><text x="720" y="711.5" font-size="16" font-weight="600" fill="#1f2933">Murieron de niños<tspan font-weight="400" fill="#7b8794" font-size="13"> · ×3 · contiene 3 piezas → figura aparte</tspan></text>
<text x="720" y="731.5" font-size="14" fill="#7b8794">Tres mueren antes de los 10 años, dos por infecciones; Berra et</text>
<text x="720" y="749.5" font-size="14" fill="#7b8794">al. asocian esa mortalidad con la endogamia (F = 0,0630)</text>
<text x="720" y="549.5" font-size="16" font-weight="600" fill="#7b8794">Con descendencia<tspan font-weight="400" fill="#7b8794" font-size="13"> · ×3</tspan></text>
<text x="720" y="569.5" font-size="14" fill="#7b8794">Solo tres de los siete que llegan a adultos tienen hijos</text>
<text x="720" y="587.5" font-size="14" fill="#7b8794">propios: por ellos sigue el árbol hacia la generación siguiente</text>
<text x="720" y="370.0" font-size="16" font-weight="600" fill="#7b8794">Sin descendencia<tspan font-weight="400" fill="#7b8794" font-size="13"> · ×4</tspan></text>
<text x="720" y="390.0" font-size="14" fill="#7b8794">Tres de los seis que tienen matrimonios largos no tienen hijos,</text>
<text x="720" y="408.0" font-size="14" fill="#7b8794">y Elizabeth nunca se casa: ahí termina la rama</text></g>
</svg>