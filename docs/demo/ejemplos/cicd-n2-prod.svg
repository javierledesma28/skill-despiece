<text x="632" y="283.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g>
<g id="fv-lista"><text x="720" y="945.0" font-size="16" font-weight="600" fill="#1f2933">Configuración del entorno</text>
<text x="720" y="965.0" font-size="14" fill="#7b8794">Entrega al arrancar lo que cambia entre despliegues (URLs,</text>
<text x="720" y="983.0" font-size="14" fill="#7b8794">tamaños, banderas); el código probado no vio estos valores</text>
<text x="720" y="795.5" font-size="16" font-weight="600" fill="#7b8794">Secretos de producción</text>
<text x="720" y="815.5" font-size="14" fill="#7b8794">Solo los recibe el job que declara el entorno de producción:</text>
<text x="720" y="833.5" font-size="14" fill="#7b8794">ninguna prueba anterior los usó</text>
<text x="720" y="556.5" font-size="16" font-weight="600" fill="#7b8794">Migración de datos</text>
<text x="720" y="576.5" font-size="14" fill="#7b8794">Cambia el esquema de una base con datos reales; hecha en</text>
<text x="720" y="594.5" font-size="14" fill="#7b8794">expandir y contraer, la versión anterior sigue funcionando</text>
<text x="720" y="420.0" font-size="16" font-weight="600" fill="#7b8794">Prueba de humo</text>
<text x="720" y="440.0" font-size="14" fill="#7b8794">Comprueba al desplegar que la versión arranca y alcanza sus</text>
<text x="720" y="458.0" font-size="14" fill="#7b8794">dependencias; si no, el despliegue se da por fallido</text>
<text x="720" y="270.0" font-size="16" font-weight="600" fill="#7b8794">Vuelta atrás</text>
<text x="720" y="290.0" font-size="14" fill="#7b8794">Devuelve el tráfico a la versión anterior sin recompilar; solo</text>
<text x="720" y="308.0" font-size="14" fill="#7b8794">es segura si el esquema sigue sirviendo a esa versión</text></g>
</svg>