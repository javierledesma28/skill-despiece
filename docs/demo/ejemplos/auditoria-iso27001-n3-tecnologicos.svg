<g id="fv-lista"><text x="720" y="612.5" font-size="16" font-weight="600" fill="#7b8794">8.8 Vulnerabilidades técnicas</text>
<text x="720" y="632.5" font-size="14" fill="#7b8794">Obliga a conocer las vulnerabilidades de lo que se usa, valorar</text>
<text x="720" y="650.5" font-size="14" fill="#7b8794">la exposición y tomar medidas a tiempo</text>
<text x="720" y="498.5" font-size="16" font-weight="600" fill="#1f2933">8.13 Copias de seguridad<tspan font-weight="400" fill="#7b8794" font-size="13"> · contiene 5 piezas → figura aparte</tspan></text>
<text x="720" y="518.5" font-size="14" fill="#7b8794">Exige mantener copias de información, software y sistemas, y</text>
<text x="720" y="536.5" font-size="14" fill="#7b8794">probarlas con regularidad según una política</text>
<text x="720" y="384.5" font-size="16" font-weight="600" fill="#7b8794">8.15 Registro de eventos</text>
<text x="720" y="404.5" font-size="14" fill="#7b8794">Exige generar, guardar, proteger y analizar registros de</text>
<text x="720" y="422.5" font-size="14" fill="#7b8794">actividad, excepciones y fallos</text>
<text x="720" y="250.0" font-size="16" font-weight="600" fill="#7b8794">Los otros 31 controles</text>
<text x="720" y="270.0" font-size="14" fill="#7b8794">Completan los 34 del tema; cuáles aplican y por qué se excluye</text>
<text x="720" y="288.0" font-size="14" fill="#7b8794">alguno lo dice la Declaración de Aplicabilidad</text></g>
</svg>