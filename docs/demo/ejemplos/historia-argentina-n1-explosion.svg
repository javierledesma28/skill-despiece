<g id="fv-lista"><text x="720" y="794.5" font-size="16" font-weight="600" fill="#7b8794">Guerras civiles (1826–1852)</text>
<text x="720" y="814.5" font-size="14" fill="#7b8794">Enfrenta a unitarios y federales sin una Constitución común;</text>
<text x="720" y="832.5" font-size="14" fill="#7b8794">Rosas gobierna Buenos Aires hasta su derrota en Caseros, en 1852</text>
<text x="720" y="685.5" font-size="16" font-weight="600" fill="#7b8794">Organización (1852–1880)</text>
<text x="720" y="705.5" font-size="14" fill="#7b8794">Sanciona la Constitución de 1853, que con reformas (la última en</text>
<text x="720" y="723.5" font-size="14" fill="#7b8794">1994) sigue vigente y fija cómo se elige al presidente</text>
<text x="720" y="576.5" font-size="16" font-weight="600" fill="#7b8794">Orden conservador (1880–1916)</text>
<text x="720" y="596.5" font-size="14" fill="#7b8794">El Partido Autonomista Nacional (PAN) controla la sucesión; en</text>
<text x="720" y="614.5" font-size="14" fill="#7b8794">1912 la Ley 8871 impone el voto secreto y obligatorio</text>
<text x="720" y="467.5" font-size="16" font-weight="600" fill="#7b8794">Radicales (1916–1930)</text>
<text x="720" y="487.5" font-size="14" fill="#7b8794">Con el voto secreto gana la UCR: Yrigoyen (1916), Alvear (1922)</text>
<text x="720" y="505.5" font-size="14" fill="#7b8794">y otra vez Yrigoyen (1928), depuesto por el golpe de 1930</text>
<text x="720" y="358.5" font-size="16" font-weight="600" fill="#1f2933">Ciclo de golpes (1930–1983)<tspan font-weight="400" fill="#7b8794" font-size="13"> · contiene 5 piezas → figura aparte</tspan></text>
<text x="720" y="378.5" font-size="14" fill="#7b8794">Seis golpes (1930, 1943, 1955, 1962, 1966 y 1976) se alternan</text>
<text x="720" y="396.5" font-size="14" fill="#7b8794">con gobiernos elegidos, varios con fraude o proscripción</text>
<text x="720" y="249.5" font-size="16" font-weight="600" fill="#7b8794">Democracia (desde 1983)</text>
<text x="720" y="269.5" font-size="14" fill="#7b8794">Desde el 10-dic-1983 no hubo golpes: la Constitución se reformó</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">en 1994 y la crisis de 2001 se resolvió en el Congreso</text></g>
</svg>