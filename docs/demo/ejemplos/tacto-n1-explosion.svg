<g id="fv-lista"><text x="720" y="1080.5" font-size="16" font-weight="600" fill="#1f2933">Mecanorreceptores<tspan font-weight="400" fill="#7b8794" font-size="13"> · contiene 4 piezas → figura aparte</tspan></text>
<text x="720" y="1100.5" font-size="14" fill="#7b8794">Convierten la presión en impulsos: se estiman unas 241 unidades</text>
<text x="720" y="1118.5" font-size="14" fill="#7b8794">por cm² en la yema y 58 en la palma</text>
<text x="720" y="912.5" font-size="16" font-weight="600" fill="#7b8794">Fibra aferente</text>
<text x="720" y="932.5" font-size="14" fill="#7b8794">Lleva los impulsos hasta la médula; es la primera neurona de la</text>
<text x="720" y="950.5" font-size="14" fill="#7b8794">cadena y su cuerpo está en el ganglio de la raíz dorsal</text>
<text x="720" y="776.0" font-size="16" font-weight="600" fill="#7b8794">Columna dorsal (médula)</text>
<text x="720" y="796.0" font-size="14" fill="#7b8794">Sube los axones hasta el bulbo ordenados por zonas: la pierna en</text>
<text x="720" y="814.0" font-size="14" fill="#7b8794">el fascículo grácil, el brazo en el cuneiforme</text>
<text x="720" y="663.0" font-size="16" font-weight="600" fill="#7b8794">Bulbo y lemnisco medial</text>
<text x="720" y="683.0" font-size="14" fill="#7b8794">Hace la primera sinapsis y cruza al otro lado: la segunda</text>
<text x="720" y="701.0" font-size="14" fill="#7b8794">neurona sube por el lemnisco medial hasta el tálamo</text>
<text x="720" y="534.5" font-size="16" font-weight="600" fill="#7b8794">Tálamo</text>
<text x="720" y="554.5" font-size="14" fill="#7b8794">Releva la señal: de aquí sale la tercera neurona, hacia la</text>
<text x="720" y="572.5" font-size="14" fill="#7b8794">circunvolución poscentral de la corteza</text>
<text x="720" y="370.0" font-size="16" font-weight="600" fill="#7b8794">Corteza somatosensorial</text>
<text x="720" y="390.0" font-size="14" fill="#7b8794">Guarda un mapa del cuerpo que agranda los dedos y la cara y</text>
<text x="720" y="408.0" font-size="14" fill="#7b8794">encoge la espalda y los hombros</text></g>
</svg>