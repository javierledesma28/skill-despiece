<g id="fv-lista"><text x="720" y="890.5" font-size="16" font-weight="600" fill="#7b8794">Abuelos (n. hacia 1730)</text>
<text x="720" y="910.5" font-size="14" fill="#7b8794">Josiah Wedgwood I y Sarah, primos terceros, son abuelos de</text>
<text x="720" y="928.5" font-size="14" fill="#7b8794">Charles y de Emma; el médico Erasmus Darwin, solo de Charles</text>
<text x="720" y="748.5" font-size="16" font-weight="600" fill="#7b8794">Padres (n. 1765–1769)</text>
<text x="720" y="768.5" font-size="14" fill="#7b8794">Susannah Wedgwood y su hermano Josiah II, hijos de Josiah I;</text>
<text x="720" y="786.5" font-size="14" fill="#7b8794">Susannah se casa con el médico Robert Darwin</text>
<text x="720" y="635.5" font-size="16" font-weight="600" fill="#7b8794">Boda Darwin–Wedgwood (1796)</text>
<text x="720" y="655.5" font-size="14" fill="#7b8794">Robert Darwin, hijo de Erasmus, se casa con Susannah Wedgwood:</text>
<text x="720" y="673.5" font-size="14" fill="#7b8794">primer cruce de las dos familias, del que nace Charles en 1809</text>
<text x="720" y="499.0" font-size="16" font-weight="600" fill="#7b8794">Charles y Emma (n. 1808–09)</text>
<text x="720" y="519.0" font-size="14" fill="#7b8794">Nietos de Josiah I. Charles comprobará en plantas (1876) que la</text>
<text x="720" y="537.0" font-size="14" fill="#7b8794">autofecundación da una progenie más débil que el cruce</text>
<text x="720" y="386.0" font-size="16" font-weight="600" fill="#1f2933">Boda de primos (1839)</text>
<text x="720" y="406.0" font-size="14" fill="#7b8794">Charles y Emma, primos hermanos, se casan en 1839; en 1870 él</text>
<text x="720" y="424.0" font-size="14" fill="#7b8794">pide que el censo mida si esas bodas dan hijos más débiles</text>
<text x="720" y="249.5" font-size="16" font-weight="600" fill="#7b8794">Diez hijos (1839–1856)<tspan font-weight="400" fill="#7b8794" font-size="13"> · contiene 3 piezas → figura aparte</tspan></text>
<text x="720" y="269.5" font-size="14" fill="#7b8794">En marzo de 1852 Darwin escribe a W. D. Fox que lo que más teme</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">para sus hijos es la «mala salud hereditaria»</text></g>
</svg>