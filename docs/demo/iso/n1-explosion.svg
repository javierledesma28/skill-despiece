<g id="fv-lista"><text x="700" y="903.0" font-size="16" font-weight="600" fill="#7b8794">Placa (PCB)</text>
<text x="700" y="923.0" font-size="14" fill="#7b8794">Sostiene y conecta todo; su tamaño (2280 = 22 × 80 mm) fija</text>
<text x="700" y="941.0" font-size="14" fill="#7b8794">cuántos chips caben</text>
<text x="700" y="811.0" font-size="16" font-weight="600" fill="#7b8794">Conector M.2 llave M</text>
<text x="700" y="831.0" font-size="14" fill="#7b8794">Entrega alimentación y hasta 4 carriles PCIe; la llave impide</text>
<text x="700" y="849.0" font-size="14" fill="#7b8794">pinchar un disco SATA</text>
<text x="700" y="629.5" font-size="16" font-weight="600" fill="#1f2933">Controladora</text>
<text x="700" y="649.5" font-size="14" fill="#7b8794">El cerebro: traduce comandos NVMe a operaciones sobre la NAND y</text>
<text x="700" y="667.5" font-size="14" fill="#7b8794">reparte el desgaste</text>
<text x="700" y="521.5" font-size="16" font-weight="600" fill="#7b8794">Caché DRAM<tspan font-weight="400" fill="#7b8794" font-size="13"> · ▲ supuesto</tspan></text>
<text x="700" y="541.5" font-size="14" fill="#7b8794">Guarda la tabla que dice en qué chip está cada bloque; sin ella,</text>
<text x="700" y="559.5" font-size="14" fill="#7b8794">el disco la busca en la propia NAND y se frena</text>
<text x="700" y="455.5" font-size="16" font-weight="600" fill="#7b8794">Chips NAND<tspan font-weight="400" fill="#7b8794" font-size="13"> · ×4 · contiene 3 piezas → figura aparte</tspan></text>
<text x="700" y="475.5" font-size="14" fill="#7b8794">Donde viven los datos; más chips en paralelo, más velocidad</text>
<text x="700" y="493.5" font-size="14" fill="#7b8794">sostenida</text></g>
