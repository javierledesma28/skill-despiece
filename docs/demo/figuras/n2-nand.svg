<g id="fv-lista"><text x="720" y="467.5" font-size="16" font-weight="600" fill="#1f2933">Celdas (TLC o QLC)<tspan font-weight="400" fill="#7b8794" font-size="13"> · ▲ supuesto</tspan></text>
<text x="720" y="487.5" font-size="14" fill="#7b8794">Cada celda guarda 3 o 4 bits; cuantos más bits, más barato y más</text>
<text x="720" y="505.5" font-size="14" fill="#7b8794">lento al escribir</text>
<text x="720" y="358.5" font-size="16" font-weight="600" fill="#1f2933">Caché SLC<tspan font-weight="400" fill="#7b8794" font-size="13"> · ▲ supuesto</tspan></text>
<text x="720" y="378.5" font-size="14" fill="#7b8794">Parte de la NAND trabaja a 1 bit por celda para absorber</text>
<text x="720" y="396.5" font-size="14" fill="#7b8794">ráfagas; al llenarse, la velocidad cae</text>
<text x="720" y="249.5" font-size="16" font-weight="600" fill="#1f2933">Bloques y páginas</text>
<text x="720" y="269.5" font-size="14" fill="#7b8794">Se escribe por páginas y se borra por bloques: por eso borrar</text>
<text x="720" y="287.5" font-size="14" fill="#7b8794">cuesta y hace falta TRIM</text></g>
