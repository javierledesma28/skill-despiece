  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#252525"/>

  <!-- texto -->
  <text x="72" y="78" font-family="'Space Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#808080">CLAUDE CODE · SKILL</text>
  <text x="68" y="172" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-weight="800" font-size="88" letter-spacing="-3" fill="#efefef"><tspan fill="#F5C500">/</tspan>despiece</text>
  <text x="72" y="222" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-weight="400" font-size="26" fill="#a0a0a0">Despiezá cualquier cosa hasta entenderla de verdad.</text>
  <text x="72" y="268" font-family="'Space Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#808080">FÍSICO · PROCESO · SISTEMA · IDEA</text>

