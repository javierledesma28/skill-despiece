<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITULO_PAGINA}}</title>
<script>document.documentElement.classList.add('js');</script>
<style>
/* Página generada por ensamblar.py --explorador (skill despiece) desde modelo.json. */
:root {
  color-scheme: light dark;
  --tinta-c:#1f2933; --tinta-o:#e6ebf0; --gris-c:#5c6b7a; --gris-o:#9aa6b2; --linea-c:#cbd2d9; --linea-o:#2b3542;
  --fondo-c:#eef1f4; --fondo-o:#0f141a; --panel-c:#ffffff; --panel-o:#171e27;
  --acento-c:{{ACENTO_C}}; --acento-o:{{ACENTO_O}}; --suave-c:{{SUAVE_C}}; --suave-o:{{SUAVE_O}};
  --titulo-c:{{TITULO_C}}; --titulo-o:{{TITULO_O}}; --aviso-c:#9a6700; --aviso-o:#e3b341;
  --tinta:var(--tinta-c); --gris:var(--gris-c); --linea:var(--linea-c); --fondo:var(--fondo-c); --panel:var(--panel-c);
  --acento:var(--acento-c); --suave:var(--suave-c); --titulo:var(--titulo-c); --aviso:var(--aviso-c);
  /* La lámina es siempre un papel claro (los colores del dibujo están pensados para él): sus tonos no cambian con el tema. */
  --hl-s:{{HL_S}}; --hl-i:{{HL_I}}; --hl-d:{{HL_D}}; --hl-b:{{HL_B}}; --hl-n:{{HL_N}};
  --ver-s:{{VER_S}}; --ver-i:{{VER_I}}; --ver-d:{{VER_D}};
  --ap-s:{{AP_S}}; --ap-i:{{AP_I}}; --ap-d:{{AP_D}}; --ap-b:{{AP_B}};
  --fuente: {{FUENTE}};
  accent-color: var(--acento);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --tinta:var(--tinta-o); --gris:var(--gris-o); --linea:var(--linea-o); --fondo:var(--fondo-o); --panel:var(--panel-o);
  --acento:var(--acento-o); --suave:var(--suave-o); --titulo:var(--titulo-o); --aviso:var(--aviso-o);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --tinta:var(--tinta-o); --gris:var(--gris-o); --linea:var(--linea-o); --fondo:var(--fondo-o); --panel:var(--panel-o);
  --acento:var(--acento-o); --suave:var(--suave-o); --titulo:var(--titulo-o); --aviso:var(--aviso-o);
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--fuente); color: var(--tinta); background: var(--fondo); line-height: 1.5; -webkit-text-size-adjust: 100%; }
a { color: var(--acento); text-underline-offset: 2px; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:where(a:any-link, button, summary, [tabindex="-1"]):focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* ---------- Estructura: barra, escenario y panel ---------- */
.app { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.barra { display: flex; align-items: center; gap: .75rem 1.25rem; padding: .6rem 1rem; background: var(--panel); border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.barra .marca { font-weight: 700; letter-spacing: .02em; font-size: .9rem; white-space: nowrap; }
.barra .marca span { color: var(--gris); font-weight: 400; }
.barra h1 { font-size: 1rem; font-weight: 600; color: var(--titulo); flex: 1 1 14rem; }
.boton { min-block-size: 32px; min-inline-size: 32px; padding: .25rem .8rem; border-radius: 8px; border: 1px solid var(--linea); background: var(--panel); cursor: pointer; }
.boton:hover { border-color: var(--acento); }
.boton[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.explorador { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); min-height: 0; }

.escena-col { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
.escenario { position: relative; overflow: hidden; min-height: 320px; view-transition-name: escenario;
  /* El pellizco lo maneja la página; el desplazamiento en los dos ejes sigue siendo del navegador. */
  touch-action: pan-x pan-y; }
.lamina { position: absolute; inset: 14px; display: grid; place-items: center; container-type: size; transform-origin: 50% 50%; }
.lamina svg { display: block; inline-size: min(100cqw, calc(100cqh * var(--ar, 1))); block-size: auto; max-block-size: 100cqh;
  background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 8px 28px rgb(0 0 0 / .08); }
.controles { display: flex; align-items: center; gap: .5rem; padding: .5rem 1rem .75rem; flex-wrap: wrap; }
.controles .boton { font-size: 1.1rem; font-weight: 700; line-height: 1; }
.pista { margin: 0 0 0 .25rem; color: var(--gris); font-size: .88rem; flex: 1 1 16rem; }
.pista.ojo { color: var(--aviso); }

.panel { background: var(--panel); border-left: 1px solid var(--linea); overflow-y: auto; min-height: 0; padding: 1rem 1.25rem 0; display: flex; flex-direction: column; gap: .9rem;
  view-transition-name: panel; }
.migas ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .1rem .3rem; font-size: .88rem; color: var(--gris); }
.migas li + li::before { content: "›"; margin-right: .3rem; color: var(--gris); }
.migas button { border: 0; background: none; padding: .15rem .2rem; min-block-size: 28px; color: var(--acento); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.migas [aria-current] { color: var(--tinta); font-weight: 600; }
.volver { align-self: flex-start; }
.etiqueta { margin: 0; color: var(--acento); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
#titulo { font-size: 1.35rem; color: var(--titulo); margin-top: .15rem; }
.eje { margin: .35rem 0 0; color: var(--gris); font-size: .9rem; }
.contexto { margin: 0; font-size: .92rem; background: var(--suave); border-radius: 8px; padding: .6rem .75rem; }
.contexto p { margin: 0 0 .35rem; } .contexto p:last-child { margin: 0; }

.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
.lista button { inline-size: 100%; display: grid; grid-template-columns: 1.8rem 1fr auto; align-items: center; gap: .6rem; text-align: start;
  min-block-size: 40px; padding: .35rem .5rem; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; }
.lista button:hover { background: var(--suave); }
.lista button[aria-current="true"] { background: var(--suave); border-color: var(--acento); }
.lista .num { display: inline-grid; place-items: center; inline-size: 1.6rem; block-size: 1.6rem; border-radius: 50%; background: var(--titulo); color: var(--panel); font-weight: 700; font-size: .8rem; }
.lista [aria-current="true"] .num { background: var(--acento); }
.lista .mas { color: var(--gris); font-size: .8rem; white-space: nowrap; }

.ficha { border-top: 1px solid var(--linea); padding-top: .9rem; }
.ficha h3 { font-size: 1.05rem; margin-bottom: .35rem; }
.ficha p { margin: 0 0 .5rem; }
.ficha .fuente { color: var(--gris); font-size: .88rem; }
.ficha .supuesto { color: var(--aviso); font-weight: 600; }
.ficha .vacia { color: var(--gris); font-size: .92rem; }
.abrir { margin-top: .25rem; background: var(--acento); color: var(--panel); border-color: var(--acento); font-weight: 600; }
.abrir:hover { filter: brightness(1.08); }
.comprension { border-top: 1px solid var(--linea); padding-top: .9rem; }
.comprension h3 { font-size: 1rem; margin-bottom: .5rem; }
.comprension ol { margin: 0 0 .75rem; padding-left: 1.2rem; font-size: .92rem; }
.comprension details { background: var(--suave); border-radius: 8px; padding: .5rem .75rem; font-size: .92rem; }
.comprension summary { cursor: pointer; font-weight: 600; min-block-size: 28px; }
.pie { margin-top: auto; padding: 1rem 0; border-top: 1px solid var(--linea); display: flex; justify-content: space-between; gap: .4rem 1rem; flex-wrap: wrap; color: var(--gris); font-size: .8rem; }
.pie .lema { color: var(--acento); letter-spacing: .14em; font-size: .7rem; font-weight: 600; text-transform: uppercase; }
.sin-js { margin: 0; padding: .6rem 1rem; background: var(--suave); font-size: .9rem; }
/* Sin JavaScript no hay zoom ni ficha: se esconde lo que no respondería */
html:not(.js) :is(.controles, .ficha, .migas, .lista) { display: none; }

/* ---------- La lámina: selección, vista previa y piezas apagadas, pintadas con CSS ---------- */
.lamina .fv-punto, .lamina .fv-llamada { cursor: pointer; }
.lamina .fv-punto > *, .lamina .fv-llamada > * { transition: fill .2s, stroke .2s, opacity .2s; }
.lamina .fv-punto.ver .fs { fill: var(--ver-s); } .lamina .fv-punto.ver .fi { fill: var(--ver-i); } .lamina .fv-punto.ver .fd { fill: var(--ver-d); }
.lamina .fv-punto.sel .fs { fill: var(--hl-s); } .lamina .fv-punto.sel .fi { fill: var(--hl-i); } .lamina .fv-punto.sel .fd { fill: var(--hl-d); }
.lamina .fv-punto.sel [stroke] { stroke: var(--hl-b); }
.lamina svg.hay-sel .fv-punto:not(.sel, .ver) .fs { fill: var(--ap-s); }
.lamina svg.hay-sel .fv-punto:not(.sel, .ver) .fi { fill: var(--ap-i); }
.lamina svg.hay-sel .fv-punto:not(.sel, .ver) .fd { fill: var(--ap-d); }
.lamina svg.hay-sel .fv-punto:not(.sel, .ver) [stroke] { stroke: var(--ap-b); }
.lamina svg.hay-sel .fv-punto:not(.sel, .ver) > :not(.fs, .fi, .fd) { opacity: .35; }
.lamina svg.hay-sel .fv-llamada:not(.sel) { opacity: .4; }
.lamina .fv-llamada.sel circle { fill: var(--hl-n); }

/* ---------- Movimiento: estático por defecto; solo con prefers-reduced-motion: no-preference ---------- */
@media (prefers-reduced-motion: no-preference) {
  .lamina.vuelve { transition: transform .25s cubic-bezier(.2, .7, .2, 1); }
  /* Zoom semántico entre niveles: entrar acerca la lámina hacia la pieza abierta; salir la aleja. */
  /* La lámina ampliada no se sale del escenario (ni tapa la cabecera ni los controles) */
  ::view-transition-group(escenario) { animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .7, .2, 1); overflow: clip; }
  /* El panel no se funde en cruz (los dos textos se pisarían): sale el viejo y después entra el nuevo */
  ::view-transition-old(panel) { animation: .15s ease-out both vt-sale-panel; }
  ::view-transition-new(panel) { animation: .25s cubic-bezier(.2, .7, .2, 1) .12s both vt-entra-panel; }
  :is(html:active-view-transition-type(entrar), html[data-vt="entrar"])::view-transition-old(escenario) {
    animation: .45s cubic-bezier(.4, 0, .2, 1) both vt-sale-cerca; transform-origin: var(--zx, 50%) var(--zy, 50%); }
  :is(html:active-view-transition-type(entrar), html[data-vt="entrar"])::view-transition-new(escenario) {
    animation: .45s cubic-bezier(.2, .7, .2, 1) both vt-entra-lejos; }
  :is(html:active-view-transition-type(salir), html[data-vt="salir"])::view-transition-old(escenario) {
    animation: .45s cubic-bezier(.4, 0, .2, 1) both vt-sale-lejos; }
  :is(html:active-view-transition-type(salir), html[data-vt="salir"])::view-transition-new(escenario) {
    animation: .45s cubic-bezier(.2, .7, .2, 1) both vt-entra-cerca; transform-origin: var(--zx, 50%) var(--zy, 50%); }
}
@keyframes vt-sale-cerca { to { transform: scale(2.4); opacity: 0; } }
@keyframes vt-entra-lejos { from { transform: scale(.55); opacity: 0; } }
@keyframes vt-sale-lejos { to { transform: scale(.55); opacity: 0; } }
@keyframes vt-entra-cerca { from { transform: scale(2.4); opacity: 0; } }
@keyframes vt-sale-panel { to { opacity: 0; } }
@keyframes vt-entra-panel { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

/* ---------- Pantallas estrechas: escenario arriba, panel debajo; la página se desplaza ---------- */
@media (max-width: 860px) {
  .explorador { grid-template-columns: 1fr; }
  .escenario { block-size: min(68svh, 620px); }
  .panel { border-left: 0; border-top: 1px solid var(--linea); overflow: visible; }
}
@media (min-width: 861px) {
  .app { block-size: 100dvh; }
  .explorador { min-height: 0; overflow: hidden; }
}
@media (pointer: coarse) {
  .boton { min-block-size: 44px; min-inline-size: 44px; }
  .lista button { min-block-size: 48px; }
  .migas button { min-block-size: 44px; }
}
@media (forced-colors: active) {
  .lista button[aria-current="true"] { outline: 2px solid CanvasText; }
}
</style>
</head>
<body>
<div class="app">
  <header class="barra">
    <div class="marca">{{MARCA_BARRA}}</div>
    <h1>{{OBJETO}}</h1>
    <button id="tema" class="boton" type="button" hidden>Tema: auto</button>
  </header>

  <main class="explorador">
    <section class="escena-col" aria-label="Lámina">
      <div class="escenario" id="escenario">
        <div class="lamina" id="lamina">{{SVG_INICIAL}}</div>
      </div>
      <div class="controles" role="group" aria-label="Zoom">
        <button id="alejar" class="boton" type="button" aria-keyshortcuts="-" aria-label="Alejar">−</button>
        <button id="acercar" class="boton" type="button" aria-keyshortcuts="+" aria-label="Acercar">+</button>
        <p class="pista" id="pista">Rueda o pellizco sobre una pieza con «+» para abrirla; hacia atrás, para volver. Teclas + y −.</p>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Piezas del nivel">
      <noscript><p class="sin-js">Sin JavaScript solo se ve el primer nivel: para abrir las piezas y ver su ficha hace falta activarlo.</p></noscript>
      <nav class="migas" aria-label="Ruta"><ol id="migas"></ol></nav>
      <button id="volver" class="boton volver" type="button" hidden>← Volver</button>
      <div>
        <p class="etiqueta" id="etiqueta">Nivel 1 · las piezas</p>
        <h2 id="titulo" tabindex="-1">{{TITULO_RAIZ}}</h2>
        <p class="eje" id="eje"></p>
      </div>
      <div class="contexto" id="contexto" hidden></div>
      <ol class="lista" id="lista"></ol>
      <section class="ficha" id="ficha" aria-labelledby="ficha-t"></section>
      <section class="comprension" id="comprension" aria-labelledby="comprension-t" hidden></section>
      <footer class="pie">{{PIE}}</footer>
    </aside>
  </main>
</div>
<div class="sr" id="aviso" aria-live="polite"></div>

{{PLANTILLAS}}
<script type="application/json" id="vista">{{VISTA_JSON}}</script>
<script>
(() => {
  'use strict';
  const V = JSON.parse(document.getElementById('vista').textContent);
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const params = new URLSearchParams(location.search);
  const escenario = $('escenario'), lamina = $('lamina'), panel = $('panel');
  const UMBRAL_DENTRO = 1.5, UMBRAL_FUERA = 0.72;

  /* ---------- Tema: automático, claro u oscuro; se recuerda en este navegador si se puede ---------- */
  const btnTema = $('tema');
  const ciclo = ['auto', 'light', 'dark'], nombres = { auto: 'auto', light: 'claro', dark: 'oscuro' };
  let tema = params.get('tema') || (() => { try { return localStorage.getItem('despiece-tema'); } catch { return null; } })() || 'auto';
  function aplicarTema(t) {
    tema = ciclo.includes(t) ? t : 'auto';
    if (tema === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = tema;
    btnTema.textContent = 'Tema: ' + nombres[tema];
    btnTema.setAttribute('aria-label', 'Tema de color: ' + nombres[tema] + '. Cambiar');
    try { localStorage.setItem('despiece-tema', tema); } catch {}
  }
  btnTema.hidden = false;
  aplicarTema(tema);
  btnTema.addEventListener('click', () => aplicarTema(ciclo[(ciclo.indexOf(tema) + 1) % ciclo.length]));

  /* ---------- Estado ---------- */
  let nivel = '';          // pieza abierta; '' = las raíces
  let sel = null;          // pieza elegida en el nivel
  let navegando = false;
  let profundidad = 0;     // posición en el historial propio
  const entradas = new Map(); // profundidad del historial → nivel (el History API no deja leer las otras entradas)
  let origenPendiente = null;

  const P = V.piezas, N = V.niveles;
  const nombre = id => id ? P[id].nombre : V.objeto;
  const tituloNivel = n => N[n].titulo;
  const profArbol = n => N[n] ? N[n].prof : 0;
  const plantilla = n => document.querySelector(`template[data-nivel="${CSS.escape(n)}"]`);
  const svgActual = () => lamina.querySelector('svg');
  const hashDe = n => '#/' + encodeURIComponent(n);
  // Un #/<id> que no es un nivel (escrito a mano, o de una versión anterior del modelo) se quita de la barra
  const urlDe = n => n ? hashDe(n) : location.pathname + location.search;
  function leerHash() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    return N[h] ? h : '';
  }
  function cadena(n) { // de la raíz a n: ['', abuelo, padre, n]
    const r = [];
    for (let q = n; q; q = P[q].padre) r.unshift(q);
    return ['', ...r];
  }

  /* ---------- Aviso para lectores de pantalla: una sola región, con un poco de retardo ---------- */
  let tAviso;
  function avisar(texto) {
    clearTimeout(tAviso);
    $('aviso').textContent = '';
    tAviso = setTimeout(() => { $('aviso').textContent = texto; }, 160);
  }
  // En pantallas táctiles no hay rueda ni teclas: la pista habla del pellizco y de los botones
  if (matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches) {
    $('pista').textContent = 'Pellizcá sobre una pieza con «+» para abrirla y al revés para volver, o usá + y −.';
  }
  const pistaBase = $('pista').textContent;
  let tPista;
  function pista(texto) {
    const el = $('pista');
    el.textContent = texto; el.classList.add('ojo');
    clearTimeout(tPista);
    tPista = setTimeout(() => { el.textContent = pistaBase; el.classList.remove('ojo'); }, 3200);
  }

  /* ---------- Pintar un nivel: lámina, migas, lista y ficha ---------- */
  function piezaEn(svg, id) { return svg?.querySelector(`.fv-punto[data-id="${CSS.escape(id)}"]`); }
  function centroDe(id) { // en px, relativo al escenario: origen de la transición
    const g = piezaEn(svgActual(), id), er = escenario.getBoundingClientRect();
    if (!g) return null;
    const r = g.getBoundingClientRect();
    return { x: r.left + r.width / 2 - er.left, y: r.top + r.height / 2 - er.top };
  }
  function fijarOrigen(p) {
    root.style.setProperty('--zx', p ? p.x + 'px' : '50%');
    root.style.setProperty('--zy', p ? p.y + 'px' : '50%');
  }

  function pintarNivel() {
    const tpl = plantilla(nivel);
    lamina.replaceChildren(tpl.content.firstElementChild.cloneNode(true));
    lamina.style.transform = '';
    escala = 1;
    const datos = N[nivel];
    // Migas: la última es la página actual
    const migas = $('migas');
    migas.replaceChildren(...cadena(nivel).map((n, i, todo) => {
      const li = document.createElement('li');
      if (i === todo.length - 1) { li.textContent = nombre(n); li.setAttribute('aria-current', 'page'); }
      else {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = nombre(n); b.dataset.ir = n;
        li.append(b);
      }
      return li;
    }));
    const volver = $('volver');
    volver.hidden = !nivel;
    if (nivel) {
      const destino = P[nivel].padre;
      volver.textContent = '← Volver a ' + nombre(destino);
      volver.setAttribute('aria-label', 'Volver a ' + nombre(destino));
    }
    $('etiqueta').textContent = nivel ? `Nivel ${datos.prof} · dentro de ${nombre(nivel)}` : 'Nivel 1 · las piezas';
    $('titulo').textContent = datos.titulo;
    $('eje').textContent = datos.subtitulo;
    $('eje').hidden = !datos.subtitulo;
    // Contexto: en la raíz, la pregunta, la frontera y lo que queda fuera
    const ctx = $('contexto');
    ctx.replaceChildren();
    if (!nivel) {
      const R = V.raiz;
      const filas = [['El todo', R.titulo], ['La pregunta', R.foco], ['Frontera', R.frontera], ['Queda fuera', R.fuera.join('; ')], ['Para', R.lector]];
      for (const [k, v] of filas) {
        if (!v) continue;
        const p = document.createElement('p'), b = document.createElement('b');
        b.textContent = k + ': '; p.append(b, v); ctx.append(p);
      }
    }
    ctx.hidden = !ctx.childElementCount;
    // Lista de piezas, numerada como la lámina
    $('lista').replaceChildren(...datos.piezas.map(id => {
      const p = P[id], li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.id = id;
      const num = document.createElement('span'); num.className = 'num'; num.textContent = p.num; num.setAttribute('aria-hidden', 'true');
      const nom = document.createElement('span'); nom.textContent = p.nombre + (p.cantidad ? ` ×${p.cantidad}` : '');
      const mas = document.createElement('span'); mas.className = 'mas';
      if (p.hijos) { mas.textContent = `+ ${p.hijos} dentro`; }
      b.setAttribute('aria-label', `${p.num}. ${nom.textContent}` + (p.hijos ? `, contiene ${p.hijos} piezas` : ''));
      b.append(num, nom, mas); li.append(b);
      return li;
    }));
    pintarComprension();
    pintarSel();
    document.title = nivel ? `${datos.titulo} · ${V.objeto}` : `${V.objeto} · explorador`;
  }

  function pintarComprension() {
    const c = $('comprension'), C = V.comprension;
    c.replaceChildren();
    c.hidden = !!nivel || (!C.feynman.length && !C.pregunta);
    if (c.hidden) return;
    const h = document.createElement('h3'); h.id = 'comprension-t'; h.textContent = 'En tres frases';
    const ol = document.createElement('ol');
    for (const f of C.feynman) { const li = document.createElement('li'); li.textContent = f; ol.append(li); }
    c.append(h, ol);
    if (C.pregunta) {
      const d = document.createElement('details'), s = document.createElement('summary'), q = document.createElement('p'), r = document.createElement('p');
      s.textContent = 'Ponete a prueba'; q.textContent = C.pregunta; r.textContent = C.respuesta || '';
      const ver = document.createElement('p'); ver.append(document.createElement('b')); ver.firstChild.textContent = 'Respuesta: ';
      ver.append(r.textContent);
      d.append(s, q, ver);
      c.append(d);
      // La respuesta queda plegada: primero se predice, después se mira
      d.open = false;
      q.style.margin = '.5rem 0';
    }
  }

  function pintarSel() {
    const svg = svgActual();
    svg?.classList.toggle('hay-sel', !!sel);
    svg?.querySelectorAll('.fv-punto, .fv-llamada').forEach(g => g.classList.toggle('sel', g.dataset.id === sel));
    $('lista').querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === sel)));
    pintarFicha();
    const acercar = $('acercar');
    const abrible = sel && P[sel].hijos;
    acercar.setAttribute('aria-label', abrible ? `Acercar: abrir ${P[sel].nombre}` : 'Acercar: elegí antes una pieza con +');
    $('alejar').setAttribute('aria-disabled', String(!nivel));
    $('alejar').setAttribute('aria-label', nivel ? `Alejar: volver a ${nombre(P[nivel].padre)}` : 'Alejar: ya estás en el todo');
  }

  function pintarFicha() {
    const f = $('ficha');
    f.replaceChildren();
    if (!sel) {
      const h = document.createElement('h3'); h.id = 'ficha-t'; h.className = 'sr'; h.textContent = 'Pieza elegida';
      const p = document.createElement('p'); p.className = 'vacia';
      p.textContent = 'Elegí una pieza en la lámina o en la lista para ver qué hace y de dónde sale.';
      f.append(h, p);
      return;
    }
    const p = P[sel];
    const h = document.createElement('h3'); h.id = 'ficha-t'; h.textContent = `${p.num} · ${p.nombre}` + (p.cantidad ? ` ×${p.cantidad}` : '');
    const fn = document.createElement('p'); fn.textContent = p.funcion;
    const fu = document.createElement('p'); fu.className = 'fuente';
    if (p.fuente) {
      fu.append('Fuente: ');
      if (p.fuente.url) { const a = document.createElement('a'); a.href = p.fuente.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = p.fuente.texto; fu.append(a); }
      else fu.append(p.fuente.texto);
    } else {
      const s = document.createElement('span'); s.className = 'supuesto'; s.textContent = '▲ supuesto'; fu.append(s, ' · sin fuente verificada');
    }
    f.append(h, fn, fu);
    if (p.hijos) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'boton abrir'; b.dataset.abrir = sel;
      b.textContent = `Abrir ${p.nombre} · ${p.hijos} piezas`;
      f.append(b);
    }
  }

  function seleccionar(id, { alternar = false } = {}) {
    sel = (alternar && sel === id) ? null : id;
    pintarSel();
  }

  /* ---------- Navegar entre niveles: historial y transición ---------- */
  const tipos = typeof ViewTransition !== 'undefined' && 'types' in ViewTransition.prototype;
  function transicion(dir, actualizar) {
    if (!document.startViewTransition || dir === 'ninguna') { actualizar(); return Promise.resolve(); }
    root.dataset.vt = dir; // respaldo para navegadores sin tipos de transición
    const t = tipos ? document.startViewTransition({ update: actualizar, types: [dir] }) : document.startViewTransition(actualizar);
    return t.finished.catch(() => {}).finally(() => { delete root.dataset.vt; });
  }

  function mostrar(destino, dir, op = {}) {
    const focoDentro = panel.contains(document.activeElement) || escenario.contains(document.activeElement);
    const desde = nivel;
    if (dir === 'entrar') fijarOrigen(op.punto || centroDe(destino));
    navegando = true;
    const actualizar = () => {
      nivel = destino; sel = null;
      // Al subir, queda elegida la pieza por la que se salió: el lector ve dónde estaba
      if (dir !== 'entrar') {
        const vuelta = cadena(desde).find(n => n && P[n].padre === destino);
        if (vuelta) sel = vuelta;
      }
      pintarNivel();
      if (dir === 'salir') fijarOrigen(sel ? centroDe(sel) : null);
    };
    return transicion(dir, actualizar).finally(() => {
      navegando = false;
      calma = performance.now() + 250;
      if (op.origen === 'carga') return;
      const porTeclado = op.origen === 'teclado' || op.origen === 'boton';
      if (porTeclado || focoDentro) {
        // Al entrar, el foco va al título del nivel nuevo; al salir, a la pieza de la que se volvió
        const volverA = dir !== 'entrar' && sel ? $('lista').querySelector(`button[data-id="${CSS.escape(sel)}"]`) : null;
        (volverA || $('titulo')).focus({ preventScroll: true });
        if (volverA) avisar(`${N[nivel].titulo}. ${N[nivel].piezas.length} piezas.`);
      } else {
        avisar(`${N[nivel].titulo}. ${N[nivel].piezas.length} piezas.`);
      }
    });
  }

  function entrar(id, op = {}) {
    if (navegando || !N[id] || id === nivel) return;
    const d = profundidad + 1;
    history.pushState({ depth: d, nivel: id }, '', hashDe(id));
    for (const k of [...entradas.keys()]) if (k >= d) entradas.delete(k);
    profundidad = d; entradas.set(d, id);
    mostrar(id, 'entrar', op);
  }

  function irA(destino, op = {}) {
    if (navegando || destino === nivel || !N[destino]) return;
    // Si el destino ya está detrás en el historial, se vuelve a él; si no (se llegó por un enlace directo), se apila
    for (const [d, n] of entradas) {
      if (n === destino && d < profundidad) { origenPendiente = op.origen; history.go(d - profundidad); return; }
    }
    const d = profundidad + 1;
    history.pushState({ depth: d, nivel: destino }, '', hashDe(destino));
    profundidad = d; entradas.set(d, destino);
    mostrar(destino, profArbol(destino) < profArbol(nivel) ? 'salir' : 'entrar', op);
  }

  function subir(op = {}) {
    if (!nivel) { pista('Ya estás en el todo: no hay nivel de arriba.'); if (op.origen === 'teclado') avisar('Ya estás en el todo.'); return; }
    irA(P[nivel].padre, op);
  }

  addEventListener('popstate', ev => {
    const st = ev.state;
    let destino;
    if (st && typeof st.nivel === 'string' && N[st.nivel]) { destino = st.nivel; profundidad = st.depth ?? 0; }
    else { // el usuario cambió el #/… a mano: entrada nueva sin estado
      destino = leerHash(); profundidad += 1;
      history.replaceState({ depth: profundidad, nivel: destino }, '', urlDe(destino));
      for (const k of [...entradas.keys()]) if (k > profundidad) entradas.delete(k); // el navegador descartó las de delante
    }
    entradas.set(profundidad, destino);
    const origen = origenPendiente || 'historial';
    origenPendiente = null;
    if (destino === nivel) return;
    // Hacia arriba se anima; hacia abajo desde el historial (adelante) se cambia sin animar
    mostrar(destino, profArbol(destino) < profArbol(nivel) ? 'salir' : 'ninguna', { origen });
  });

  /* ---------- Zoom semántico: rueda, pellizco, botones y teclado ---------- */
  let escala = 1, objetivo = undefined, tSoltar, calma = 0;
  // Tras cambiar de nivel, la inercia del trackpad sigue mandando rueda: se absorbe hasta que haya 250 ms de
  // quietud, para que un solo gesto no abra dos niveles seguidos. El pellizco no tiene inercia: solo espera a
  // que acabe la calma (extender = false) y sigue desde donde estén los dedos.
  function bloqueado(extender = true) {
    if (!navegando && performance.now() >= calma) return false;
    if (extender) calma = Math.max(calma, performance.now() + 250);
    return true;
  }
  function piezaBajo(x, y) {
    const g = document.elementFromPoint(x, y)?.closest('.fv-punto, .fv-llamada');
    if (g && lamina.contains(g)) return g.dataset.id;
    // En hueco (entre las copias de una pieza ×N, junto a una pieza fina o entre las letras de un rótulo, que
    // en SVG solo responde sobre los glifos): la pieza o el rótulo de caja más pequeña que contenga el punto.
    // Así el gesto sobre «la zona» de una pieza la abre aunque no toque su dibujo.
    let mejor = null, area = Infinity;
    for (const p of lamina.querySelectorAll('.fv-punto, .fv-llamada')) {
      const r = p.getBoundingClientRect();
      if (x < r.left || x > r.right || y < r.top || y > r.bottom) continue;
      if (r.width * r.height < area) { area = r.width * r.height; mejor = p.dataset.id; }
    }
    return mejor;
  }
  function soltar() {
    escala = 1; objetivo = undefined;
    lamina.classList.add('vuelve');
    lamina.style.transform = '';
  }
  function gesto(factor, x, y) {
    if (navegando) return;
    const er = escenario.getBoundingClientRect();
    if (objetivo === undefined) {
      objetivo = piezaBajo(x, y);
      lamina.classList.remove('vuelve');
      // El origen del zoom es el punto del gesto, en la caja sin transformar de la lámina (inset 14px)
      lamina.style.transformOrigin = `${x - er.left - 14}px ${y - er.top - 14}px`;
    }
    escala = Math.min(1.8, Math.max(.6, escala * factor));
    if (escala >= UMBRAL_DENTRO) {
      if (objetivo && P[objetivo].hijos) {
        const id = objetivo, p = { x: x - er.left, y: y - er.top };
        soltarTarde();
        entrar(id, { punto: p, origen: 'gesto' });
        return;
      }
      escala = UMBRAL_DENTRO - .02;
      pista(objetivo ? `«${P[objetivo].nombre}» no tiene piezas dentro.` : 'Acercá sobre una pieza con «+» para abrirla.');
    } else if (escala <= UMBRAL_FUERA) {
      if (nivel) { soltarTarde(); subir({ origen: 'gesto' }); return; }
      escala = UMBRAL_FUERA + .02;
      pista('Ya estás en el todo: no hay nivel de arriba.');
    }
    lamina.style.transform = `scale(${escala})`;
    clearTimeout(tSoltar);
    tSoltar = setTimeout(soltar, 280);
  }
  function soltarTarde() { clearTimeout(tSoltar); objetivo = undefined; escala = 1; }

  escenario.addEventListener('wheel', ev => {
    // Sin Ctrl (el pellizco del trackpad llega como Ctrl + rueda), la rueda solo hace zoom si la página no
    // tiene nada que desplazar: nunca se le roba el scroll al lector.
    const desplazable = document.scrollingElement.scrollHeight > innerHeight + 2;
    if (!ev.ctrlKey && desplazable) return;
    ev.preventDefault(); // también evita que Ctrl + rueda haga zoom de toda la página
    if (bloqueado()) return;
    const dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
    gesto(Math.exp(-dy * (ev.ctrlKey ? .012 : .0018)), ev.clientX, ev.clientY);
  }, { passive: false });

  const punteros = new Map();
  let dist0 = 0, escala0 = 1;
  const distancia = () => { const [a, b] = [...punteros.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  escenario.addEventListener('pointerdown', ev => {
    if (ev.pointerType === 'mouse') return;
    punteros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (punteros.size === 2) { dist0 = distancia(); escala0 = escala; }
  });
  escenario.addEventListener('pointermove', ev => {
    if (!punteros.has(ev.pointerId)) return;
    punteros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (punteros.size !== 2 || !dist0) return;
    if (bloqueado(false)) { dist0 = distancia(); escala0 = escala; return; } // sigue desde aquí, no desde antes del salto
    const [a, b] = [...punteros.values()];
    gesto((escala0 * distancia() / dist0) / escala, (a.x + b.x) / 2, (a.y + b.y) / 2);
  });
  const fuera = ev => { punteros.delete(ev.pointerId); if (punteros.size < 2) dist0 = 0; };
  escenario.addEventListener('pointerup', fuera);
  escenario.addEventListener('pointercancel', fuera);

  // Clic en la lámina: elige (volver a tocarla la suelta); doble clic en una pieza con «+»: la abre
  lamina.addEventListener('click', ev => {
    const g = ev.target.closest('.fv-punto, .fv-llamada');
    if (!g) { if (sel) seleccionar(null); return; }
    seleccionar(g.dataset.id, { alternar: true });
  });
  lamina.addEventListener('dblclick', ev => {
    const g = ev.target.closest('.fv-punto, .fv-llamada');
    if (g && P[g.dataset.id].hijos) {
      const er = escenario.getBoundingClientRect();
      entrar(g.dataset.id, { punto: { x: ev.clientX - er.left, y: ev.clientY - er.top }, origen: 'puntero' });
    }
  });
  // Vista previa: pasar por la lista ilumina la pieza en la lámina
  function previa(id, si) { piezaEn(svgActual(), id)?.classList.toggle('ver', si); }
  $('lista').addEventListener('pointerover', ev => { const b = ev.target.closest('button'); if (b) previa(b.dataset.id, true); });
  $('lista').addEventListener('pointerout', ev => { const b = ev.target.closest('button'); if (b) previa(b.dataset.id, false); });
  $('lista').addEventListener('focusin', ev => { if (ev.target.dataset.id) previa(ev.target.dataset.id, true); });
  $('lista').addEventListener('focusout', ev => { if (ev.target.dataset.id) previa(ev.target.dataset.id, false); });
  $('lista').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) seleccionar(b.dataset.id); });
  $('ficha').addEventListener('click', ev => {
    const b = ev.target.closest('[data-abrir]');
    if (b) entrar(b.dataset.abrir, { origen: 'boton' });
  });
  $('migas').addEventListener('click', ev => { const b = ev.target.closest('[data-ir]'); if (b) irA(b.dataset.ir, { origen: 'boton' }); });
  $('volver').addEventListener('click', () => subir({ origen: 'boton' }));
  function acercar(origen) {
    if (sel && P[sel].hijos) { entrar(sel, { origen }); return; }
    const texto = sel ? `«${P[sel].nombre}» no tiene piezas dentro.` : 'Elegí antes una pieza con «+» en la lámina o en la lista.';
    pista(texto);
    if (origen !== 'gesto') avisar(texto);
  }
  $('acercar').addEventListener('click', () => acercar('boton'));
  $('alejar').addEventListener('click', () => subir({ origen: 'boton' }));
  addEventListener('keydown', ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.target instanceof Element && ev.target.closest('input, textarea, select, [contenteditable]')) return;
    if (ev.key === '+' || ev.key === '=') { ev.preventDefault(); acercar('teclado'); }
    else if (ev.key === '-' || ev.key === '_') { ev.preventDefault(); subir({ origen: 'teclado' }); }
  });

  /* ---------- Arranque: el nivel del enlace (#/<id>) o la raíz, sin animar ni mover el foco ---------- */
  const inicial = leerHash();
  history.replaceState({ depth: 0, nivel: inicial }, '', urlDe(inicial));
  entradas.set(0, inicial);
  nivel = null;
  mostrar(inicial, 'ninguna', { origen: 'carga' });
  if (params.get('sel') && P[params.get('sel')] && P[params.get('sel')].padre === inicial) seleccionar(params.get('sel'));
})();
</script>
</body>
</html>
